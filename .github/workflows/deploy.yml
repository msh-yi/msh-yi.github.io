name: Deploy Next.js site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: next
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build with Next.js
        run: npm run build
        
      - name: Debug - List all files and directories
        run: |
          echo "=== Current working directory ==="
          pwd
          echo "=== Contents of project root ==="
          ls -la
          echo "=== Looking for out directory ==="
          find . -name "out" -type d
          echo "=== Contents of out directory if it exists ==="
          if [ -d "./out" ]; then
            ls -la ./out/
            echo "=== Sample files in out ==="
            find ./out -type f | head -10
          else
            echo "out directory not found"
          fi
          echo "=== Contents of .next directory ==="
          if [ -d "./.next" ]; then
            ls -la ./.next/
          else
            echo ".next directory not found"
          fi
          
      - name: Upload artifact (only if out exists)
        if: hashFiles('out/**') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
          
      - name: Fallback - Create empty out directory if needed
        if: hashFiles('out/**') == ''
        run: |
          echo "Creating empty out directory for debugging"
          mkdir -p out
          echo "<html><body><h1>Debug: Build failed</h1></body></html>" > out/index.html
          
      - name: Upload fallback artifact
        if: hashFiles('out/**') == ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4